<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #1c1b19; color: #ede6d6; font-family: Barlow, sans-serif; position: relative; }
  .frame { position: absolute; inset: 28px; border: 2px solid #3e3a33; border-radius: 22px; background: radial-gradient(120% 90% at 85% 10%, #2c2922 0%, #1c1b19 60%); }
  .top { position: absolute; left: 72px; top: 66px; display: flex; align-items: center; gap: 18px; }
  .top img { height: 64px; }
  h1 { position: absolute; left: 72px; top: 168px; width: 1060px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 92px; line-height: .98; letter-spacing: .005em; }
  h1 span { color: #c9a15a; }
  .sub { position: absolute; left: 74px; top: 372px; font-size: 30px; color: #a39b8a; font-weight: 500; }
  .wave { position: absolute; left: 72px; right: 72px; bottom: 74px; height: 92px; display: flex; align-items: center; gap: 5px; }
  .wave i { flex: 1; border-radius: 4px; }
  .labels { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
  .labels b:first-child { color: #857c6b; font-weight: 500; }
  .labels b:last-child { color: #c9a15a; font-weight: 500; }
  .badge { position: absolute; right: 72px; top: 74px; padding: 12px 22px; border: 2px solid #c9a15a; border-radius: 999px; color: #c9a15a; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 28px; letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="top"><img src="../../web/public/brand/fastmix-logo.svg" alt=""></div>
  <div class="badge">Free preview</div>
  <h1>Mix and master your vocals<br><span>in minutes.</span></h1>
  <p class="sub">Upload a beat and a vocal, describe the sound, hear it free.</p>
  <div class="wave" id="wave"></div>
  <div class="labels"><b>Raw take</b><b>Mixed by FastMix</b></div>
<script>
  // Raw half: uneven, quiet with spikes. Mixed half: full and even. Fixed seed so the image is reproducible.
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const wave = document.getElementById("wave"); const count = 120;
  for (let i = 0; i < count; i++) {
    const bar = document.createElement("i"); const mixed = i >= count / 2;
    const h = mixed ? 58 + rnd() * 34 : (rnd() < .18 ? 55 + rnd() * 40 : 10 + rnd() * 26);
    bar.style.height = h + "%"; bar.style.background = mixed ? "#c9a15a" : "#5d574b";
    wave.appendChild(bar);
  }
</script>
</body></html>
