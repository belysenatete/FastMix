services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastmix
      POSTGRES_USER: fastmix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastmix_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmix -d fastmix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fastmix_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fastmix_storage_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - audio_data:/data

  storage-init:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - storage
    entrypoint: >-
      /bin/sh -c 'until mc alias set local http://storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/fastmix-audio;
      mc anonymous set private local/fastmix-audio'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fastmix_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fastmix_storage_dev_only}

  migrate:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fastmix:${POSTGRES_PASSWORD:-fastmix_dev_only}@db:5432/fastmix
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint: >-
      /bin/sh -c 'psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f /migrations/002_job_indexes.sql && psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f /migrations/003_clerk_identity.sql && psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f /migrations/004_full_renders.sql && psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f /migrations/005_version_settings.sql'

  api:
    build: ./worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fastmix:${POSTGRES_PASSWORD:-fastmix_dev_only}@db:5432/fastmix
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-fastmix_local_worker_secret}
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fastmix_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fastmix_storage_dev_only}
      S3_BUCKET: ${S3_BUCKET:-fastmix-audio}
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      ROEX_ENABLED: ${ROEX_API_KEY:+true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  processor:
    build: ./worker
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fastmix:${POSTGRES_PASSWORD:-fastmix_dev_only}@db:5432/fastmix
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-fastmix_local_worker_secret}
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fastmix_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fastmix_storage_dev_only}
      S3_BUCKET: ${S3_BUCKET:-fastmix-audio}
      ROEX_API_KEY: ${ROEX_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  audio_data:
